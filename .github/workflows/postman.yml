name: API Tests (Postman)

# Runs the CPACE mobile-API smoke collection (CPACE/postman/collection.json)
# via Newman and uploads the JSON result to the Super Admin "Test Reports"
# -> API Tests tab automatically. The collection logs in as the dedicated
# student@cpace.test test account (seeded by CPACE/database/cpace_database.sql),
# exercises most of CPACE/routes/api.php, and cleans up everything it
# creates (cancels the training-mode quiz it starts, deletes the review
# note it creates, logs out at the end).
#
# SETUP NEEDED before this does anything against a real deployment:
#   Two repo secrets (Settings -> Secrets and variables -> Actions):
#     CPACE_APP_URL             e.g. https://staging.cpace.site — a
#                                non-production deployment (see
#                                DEPLOYMENT-STAGING.md), never cpace.site
#     CPACE_TEST_REPORTS_TOKEN  a named Super Admin API token from
#                                /superadmin/api-tokens on that staging
#                                site ("GitHub Actions — Postman")

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

jobs:
  postman:
    runs-on: ubuntu-latest
    steps:
      - name: Check staging is configured
        id: staging
        run: |
          if [ -n "${{ secrets.CPACE_APP_URL }}" ] && [ -n "${{ secrets.CPACE_TEST_REPORTS_TOKEN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping — CPACE_APP_URL/CPACE_TEST_REPORTS_TOKEN aren't set yet. Nothing to fail here until staging exists (see DEPLOYMENT-STAGING.md)."
          fi

      - uses: actions/checkout@v4
        if: steps.staging.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.staging.outputs.configured == 'true'
        with:
          node-version: 20

      - run: npm install -g newman
        if: steps.staging.outputs.configured == 'true'

      - name: Run Postman collection
        if: steps.staging.outputs.configured == 'true'
        run: |
          newman run CPACE/postman/collection.json \
            -e CPACE/postman/environment.json \
            --env-var "baseUrl=${{ secrets.CPACE_APP_URL }}" \
            --reporters cli,json --reporter-json-export newman-report.json
        continue-on-error: true

      - name: Upload result to CPACE
        if: steps.staging.outputs.configured == 'true'
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          node -e "
            const fs = require('fs');
            const payload = JSON.parse(fs.readFileSync('newman-report.json', 'utf8'));
            const body = { type: 'api', title: \`Postman — \${process.env.REF_NAME} @ \${process.env.SHA}\`, payload };
            fs.writeFileSync('upload-body.json', JSON.stringify(body));
          "
          curl -sf -X POST "${{ secrets.CPACE_APP_URL }}/api/test-reports" \
            -H "Authorization: Bearer ${{ secrets.CPACE_TEST_REPORTS_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data-binary @upload-body.json
